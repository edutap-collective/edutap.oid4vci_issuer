[project]
name = "edutap.oid4vci_issuer"
dynamic = ["version"]
description = "Issues selective-disclosure verifiable credentials over OpenID4VCI"
keywords = ["OpenID4VCI", "SD-JWT VC", "Verifiable Credentials", "eduTAP"]
readme = "README.md"
authors = [
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
]
requires-python = ">=3.12"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    # The protocol lives there; this service decides what to issue and to whom.
    "openid4vci[fastapi]>=1.0.0a1",
    "pydantic[email]>=2.0",
    "pydantic-settings",
    "uvicorn[standard]",
]

[project.urls]
Source = "https://github.com/edutap-collective/edutap.oid4vci_issuer"
Issues = "https://github.com/edutap-collective/edutap.oid4vci_issuer/issues"

[dependency-groups]
test = [
    "httpx2",
    "pytest",
    "anyio",
]
typecheck = [
    "ty",
]
develop = [
    "pdbp",  # the maintained successor to pdbpp
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/edutap/oid4vci_issuer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# generated by hatch-vcs on every build, untracked, not ours to lint
extend-exclude = ["src/edutap/oid4vci_issuer/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
no-sections = true
order-by-type = false

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src", "tests"]

[tool.ty.rules]
unresolved-import = "warn"
# pydantic-settings builds its __init__ dynamically: `_env_file` is a real and
# documented parameter, and a required field may legitimately be omitted when
# the environment supplies it.
missing-argument = "warn"
unknown-argument = "warn"
invalid-argument-type = "warn"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.codespell]
ignore-words-list = "discreet,"

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "src/edutap/oid4vci_issuer/_version.py",
]
